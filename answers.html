<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정해진 내용 알려주기 · 바자회 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/answers.css">
<script src="assets/shared.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/config.js"></script>
</head>
<body>

<nav class="topbar">
  <a class="home" href="index.html">&larr; 준비 허브</a>
  <span class="where">정해진 내용 알려주기</span>
</nav>

<div class="page-head">
  <h1>정해진 내용 알려주기</h1>
  <p>회의에서 정해진 것을 적어 보내주시면 담당자가 문서에 반영합니다.</p>
</div>

<main>
  <div class="card" id="setup-warning" hidden>
    <h2>아직 연결되지 않았습니다</h2>
    <p class="lead">저장할 곳(구글 시트)이 연결되지 않아 입력을 받을 수 없습니다. 저장소의 <code>SETUP-SHEETS.md</code>에 적힌 순서대로 설정한 뒤, 배포 주소를 <code>assets/config.js</code>에 넣어주세요.</p>
  </div>

  <form class="card" id="form">
    <h2>내용 보내기</h2>
    <p class="lead">한 번에 한 가지씩 적어주세요. 여러 건이면 나눠서 보내시면 됩니다.</p>

    <div class="row">
      <div class="field">
        <label for="f-name">이름</label>
        <input type="text" id="f-name" autocomplete="name" placeholder="예: 홍길동">
      </div>
      <div class="field">
        <label for="f-password">공유 암호
          <span class="help">교회에서 안내받은 암호입니다. 한 번 넣으면 기억합니다.</span>
        </label>
        <input type="password" id="f-password" autocomplete="off">
      </div>
    </div>

    <div class="field" style="margin-top:18px">
      <label for="f-doc">어느 문서에 관한 내용인가요?</label>
      <select id="f-doc"></select>
    </div>

    <div class="field">
      <label for="f-item">항목
        <span class="help">무엇에 대한 결정인지 짧게 적어주세요.</span>
      </label>
      <input type="text" id="f-item" placeholder="예: 설거지 시간대별 인원">
    </div>

    <div class="field">
      <label for="f-answer">정해진 내용</label>
      <textarea id="f-answer" placeholder="예: 과거대로 2/4/3/3/3/2명으로 하고, 남자 집사님으로 한정하지 않기로 함"></textarea>
    </div>

    <div class="actions">
      <button type="submit" id="btn-save">보내기</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>

  <div class="card">
    <h2>지금까지 보내주신 내용</h2>
    <p class="lead" id="list-lead">암호를 넣고 <button type="button" id="btn-load" class="btn-secondary" style="min-height:38px;padding:6px 14px;font-size:15px">불러오기</button>를 누르면 표시됩니다.</p>
    <div class="answers" id="answers"></div>
  </div>
</main>

<script src="assets/answers.js"></script>
</body>
</html>
