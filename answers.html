<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정해진 내용 알려주기 · 바자회 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/nav.js"></script>
<script src="assets/config.js"></script>
<style>
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--color-hairline);
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 27px; font-weight: 800; color: var(--color-ink); letter-spacing: -0.6px; }
  header p { margin: 0; color: var(--color-mute); font-size: 17px; }
  header a.back { display: inline-block; margin-top: 12px; color: var(--color-mute); font-weight: 600; font-size: 16px; text-decoration: none; }

  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

  .card {
    background: var(--color-surface-card);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 24px;
  }
  .card h2 { margin: 0 0 6px; font-size: 21px; font-weight: 700; color: var(--color-ink); }
  .card .lead { margin: 0 0 18px; font-size: 16px; color: var(--color-mute); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 17px; font-weight: 600; color: var(--color-ink); margin-bottom: 7px; }
  .field .help { display: block; font-weight: 400; font-size: 15px; color: var(--color-mute); margin-top: 3px; }
  .field input, .field select, .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 18px;
    padding: 11px 14px;
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    background: var(--color-surface-card);
    color: var(--color-ink);
  }
  .field input, .field select { height: 50px; }
  .field textarea { min-height: 130px; line-height: 1.6; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--color-accent-blue);
    box-shadow: 0 0 0 3px rgba(44, 132, 224, 0.25);
  }

  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  .row .field { flex: 1 1 240px; margin-bottom: 0; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px; }
  .msg { font-size: 16px; font-weight: 600; }
  .msg.ok { color: var(--color-accent-green); }
  .msg.err { color: var(--color-accent-red); }

  .answers { margin-top: 8px; }
  .answer {
    border: 1px solid var(--color-hairline);
    border-left: 4px solid var(--color-ink);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 12px;
    background: var(--color-surface-doc);
  }
  .answer .meta { font-size: 15px; color: var(--color-mute); margin-bottom: 6px; }
  .answer .meta strong { color: var(--color-ink); font-weight: 700; }
  .answer .item { font-size: 17px; font-weight: 700; color: var(--color-ink); margin-bottom: 5px; }
  .answer .body { font-size: 17px; line-height: 1.65; margin: 0; }

  .empty { color: var(--color-mute); font-size: 17px; }
</style>
</head>
<body>

<header>
  <h1>정해진 내용 알려주기</h1>
  <p>회의에서 정해진 것을 적어 보내주시면 담당자가 문서에 반영합니다.</p>
  <a class="back" href="index.html">← 허브로</a>
</header>

<main>
  <div class="card" id="setup-warning" hidden>
    <h2>아직 연결되지 않았습니다</h2>
    <p class="lead">저장할 곳(구글 시트)이 연결되지 않아 입력을 받을 수 없습니다. 저장소의 <code>SETUP-SHEETS.md</code>에 적힌 순서대로 설정한 뒤, 배포 주소를 <code>assets/config.js</code>에 넣어주세요.</p>
  </div>

  <form class="card" id="form">
    <h2>내용 보내기</h2>
    <p class="lead">한 번에 한 가지씩 적어주세요. 여러 건이면 나눠서 보내시면 됩니다.</p>

    <div class="row">
      <div class="field">
        <label for="f-name">이름</label>
        <input type="text" id="f-name" autocomplete="name" placeholder="예: 홍길동">
      </div>
      <div class="field">
        <label for="f-password">공유 암호
          <span class="help">교회에서 안내받은 암호입니다. 한 번 넣으면 기억합니다.</span>
        </label>
        <input type="password" id="f-password" autocomplete="off">
      </div>
    </div>

    <div class="field" style="margin-top:18px">
      <label for="f-doc">어느 문서에 관한 내용인가요?</label>
      <select id="f-doc"></select>
    </div>

    <div class="field">
      <label for="f-item">항목
        <span class="help">무엇에 대한 결정인지 짧게 적어주세요.</span>
      </label>
      <input type="text" id="f-item" placeholder="예: 설거지 시간대별 인원">
    </div>

    <div class="field">
      <label for="f-answer">정해진 내용</label>
      <textarea id="f-answer" placeholder="예: 과거대로 2/4/3/3/3/2명으로 하고, 남자 집사님으로 한정하지 않기로 함"></textarea>
    </div>

    <div class="actions">
      <button type="submit" id="btn-save">보내기</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>

  <div class="card">
    <h2>지금까지 보내주신 내용</h2>
    <p class="lead" id="list-lead">암호를 넣고 <button type="button" id="btn-load" class="btn-secondary" style="min-height:38px;padding:6px 14px;font-size:15px">불러오기</button>를 누르면 표시됩니다.</p>
    <div class="answers" id="answers"></div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var PW_KEY = "cbz_answers_pw";
  var NAME_KEY = "cbz_answers_name";

  var url = (window.ANSWERS_URL || "").trim();
  var form = document.getElementById("form");
  var msg = document.getElementById("msg");

  if (!url) {
    document.getElementById("setup-warning").hidden = false;
    form.querySelectorAll("input, select, textarea, button").forEach(function (el) { el.disabled = true; });
    document.getElementById("btn-load").disabled = true;
  }

  // The document dropdown follows the reading order, so the labels match what
  // people see in the sidebar.
  (function fillDocs() {
    var sel = document.getElementById("f-doc");
    sel.innerHTML = '<option value="">— 문서를 고르세요 (모르면 비워두세요) —</option>' +
      window.SEQUENCE.map(function (item) {
        return '<option value="' + item.label + '">' + item.label + "</option>";
      }).join("");
  })();

  // Remembering the name and the shared password keeps repeat submissions short;
  // both stay in this browser only.
  try {
    document.getElementById("f-password").value = localStorage.getItem(PW_KEY) || "";
    document.getElementById("f-name").value = localStorage.getItem(NAME_KEY) || "";
  } catch (e) { /* 저장 공간이 막혀 있어도 입력에는 문제가 없다 */ }

  function remember() {
    try {
      localStorage.setItem(PW_KEY, document.getElementById("f-password").value);
      localStorage.setItem(NAME_KEY, document.getElementById("f-name").value);
    } catch (e) { /* 무시 */ }
  }

  // Apps Script never receives a CORS preflight, so the body goes as text/plain
  // even though it is JSON.
  function send(payload) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.text().then(function (body) {
        try {
          return JSON.parse(body);
        } catch (e) {
          // A wrong address, or a deployment that was never updated, answers with
          // an HTML page. The parse error itself means nothing to a volunteer.
          throw new Error("저장하는 곳에서 예상과 다른 응답이 왔습니다. 연결 주소가 맞는지 확인해 주세요.");
        }
      });
    }, function () {
      throw new Error("저장하는 곳에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.");
    });
  }

  function setMsg(text, kind) {
    msg.textContent = text;
    msg.className = "msg" + (kind ? " " + kind : "");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var payload = {
      action: "save",
      password: document.getElementById("f-password").value,
      name: document.getElementById("f-name").value,
      doc: document.getElementById("f-doc").value,
      item: document.getElementById("f-item").value,
      answer: document.getElementById("f-answer").value
    };
    if (!payload.name || !payload.item || !payload.answer) {
      setMsg("이름, 항목, 내용을 모두 적어주세요.", "err");
      return;
    }

    document.getElementById("btn-save").disabled = true;
    setMsg("보내는 중…");

    send(payload).then(function (r) {
      document.getElementById("btn-save").disabled = false;
      if (!r.ok) { setMsg(r.error || "저장하지 못했습니다.", "err"); return; }
      remember();
      setMsg("보냈습니다. 고맙습니다.", "ok");
      document.getElementById("f-item").value = "";
      document.getElementById("f-answer").value = "";
      renderAnswers(r.rows);
    }).catch(function (err) {
      document.getElementById("btn-save").disabled = false;
      setMsg("보내지 못했습니다: " + err.message, "err");
    });
  });

  document.getElementById("btn-load").addEventListener("click", function () {
    var pw = document.getElementById("f-password").value;
    if (!pw) { setMsg("공유 암호를 먼저 넣어주세요.", "err"); return; }
    document.getElementById("list-lead").textContent = "불러오는 중…";
    send({ action: "list", password: pw }).then(function (r) {
      if (!r.ok) { document.getElementById("list-lead").textContent = r.error || "불러오지 못했습니다."; return; }
      remember();
      document.getElementById("list-lead").textContent =
        r.rows.length ? "모두 " + r.rows.length + "건입니다. 최근에 보낸 것이 위에 있습니다." : "";
      renderAnswers(r.rows);
    }).catch(function (err) {
      document.getElementById("list-lead").textContent = "불러오지 못했습니다: " + err.message;
    });
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderAnswers(rows) {
    var box = document.getElementById("answers");
    if (!rows || !rows.length) {
      box.innerHTML = '<p class="empty">아직 들어온 내용이 없습니다.</p>';
      return;
    }
    box.innerHTML = rows.map(function (r) {
      return '<div class="answer">' +
        '<p class="meta"><strong>' + esc(r.name) + "</strong>" +
        (r.doc ? " · " + esc(r.doc) : "") +
        (r.at ? " · " + esc(r.at) : "") + "</p>" +
        '<p class="item">' + esc(r.item) + "</p>" +
        '<p class="body">' + esc(r.answer).replace(/\n/g, "<br>") + "</p>" +
        "</div>";
    }).join("");
  }
})();
</script>
</body>
</html>
