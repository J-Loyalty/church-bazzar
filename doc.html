<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 보기 · 바자회 준비 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/markdown.js"></script>
<script src="assets/nav.js"></script>
<style>
  .layout {
    display: flex;
    align-items: flex-start;
    max-width: 1600px;
    margin: 0 auto;
  }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 24px 16px;
    position: sticky;
    top: 0;
    align-self: flex-start;
    max-height: 100vh;
    overflow-y: auto;
  }

  .sidebar h2 {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-mute);
    margin: 20px 0 8px;
  }
  .sidebar h2:first-of-type { margin-top: 0; }

  .sidebar ul { list-style: none; margin: 0; padding: 0; }
  .sidebar li a {
    display: block;
    padding: 11px 12px;
    margin-bottom: 3px;
    border-radius: var(--radius-sm);
    color: var(--color-body);
    text-decoration: none;
    font-size: 16px;
  }
  .sidebar li a:hover { background: var(--color-surface-soft); }
  .sidebar li a.active {
    background: var(--color-surface-card);
    color: var(--color-ink);
    font-weight: 700;
    border: 1px solid var(--color-hairline);
  }

  /* On narrow screens the doc list collapses behind this toggle so the
     document itself is visible without scrolling past every doc first. */
  .sidebar-toggle {
    display: none;
    width: 100%;
    text-align: left;
    background: var(--color-surface-card);
    border: 1px solid var(--color-hairline);
    color: var(--color-ink);
    font-size: 17px;
    font-weight: 500;
    padding: 14px 16px;
    height: auto;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
  }
  .sidebar-toggle .chevron { float: right; transition: transform 0.15s; }
  .sidebar-toggle.open .chevron { transform: rotate(180deg); }

  .article-wrap {
    flex: 1;
    min-width: 0;
    padding: 32px 24px 80px;
  }

  .doc-card {
    max-width: 1120px;
    background: var(--color-surface-doc);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-md);
    padding: 32px;
  }

  .doc-card h1 {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1.18;
    color: var(--color-ink);
    margin: 0 0 20px;
  }
  .doc-card h2 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--color-ink);
    margin: 38px 0 14px;
    padding-top: 18px;
    border-top: 1px solid var(--color-hairline-soft);
  }
  .doc-card h2:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .doc-card h3 {
    font-family: var(--font-body);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--color-ink);
    margin: 28px 0 10px;
  }
  .doc-card p { margin: 0 0 16px; font-size: 17px; line-height: 1.75; }
  .doc-card ul, .doc-card ol { margin: 0 0 16px; padding-left: 24px; font-size: 17px; line-height: 1.75; }
  .doc-card li { margin-bottom: 9px; }
  .doc-card li.checkbox-item { list-style: none; margin-left: -24px; }
  .doc-card li.checkbox-item input {
    margin-right: 9px;
    width: 17px;
    height: 17px;
    vertical-align: -2px;
  }
  .doc-card hr { border: none; border-top: 1px solid var(--color-hairline); margin: 24px 0; }
  .doc-card strong { color: var(--color-ink); font-weight: 700; }
  .doc-card del { color: var(--color-mute); }

  .doc-loading, .doc-error { color: var(--color-mute); font-size: 17px; }
  .doc-error { color: var(--color-accent-red); }

  .prev-next {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 1120px;
    margin-top: 24px;
  }
  .prev-next a {
    flex: 0 1 auto;
    background: var(--color-surface-card);
    border: 1px solid var(--color-hairline-strong);
    border-radius: var(--radius-lg);
    padding: 14px 20px;
    text-decoration: none;
    color: var(--color-ink);
    font-size: 17px;
    font-weight: 500;
  }
  .prev-next a:hover { background: var(--color-surface-soft); }
  .prev-next .label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-mute);
    margin-bottom: 3px;
  }
  .prev-next .next {
    text-align: right;
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-on-primary);
  }
  .prev-next .next:hover { background: var(--color-primary-pressed); }
  .prev-next .next .label { color: var(--color-on-dark-soft); }
  .prev-next .progress {
    flex: 0 0 auto;
    font-size: 15px;
    color: var(--color-mute);
  }

  @media (max-width: 860px) {
    /* Stacked, the sidebar and the article are full-width rows. Left over from
       the desktop layout, align-items:flex-start sizes them to their content
       instead, which let the article push the page a hair past the screen. */
    .layout { flex-direction: column; align-items: stretch; }
    .sidebar {
      width: 100%;
      position: static;
      max-height: none;
      border-bottom: 1px solid var(--color-hairline);
      padding: 16px;
    }
    .sidebar-toggle { display: block; }
    .sidebar-groups { display: none; }
    .sidebar-groups.open { display: block; }
    .article-wrap { padding: 24px 16px 60px; }
    .doc-card { max-width: none; padding: 20px; }
  }
</style>
</head>
<body>

<nav class="topbar">
  <a class="home" href="index.html">&larr; 준비 허브</a>
  <span class="where" id="where"></span>
</nav>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="article-wrap">
    <article class="doc-card" id="content">
      <p class="doc-loading">불러오는 중…</p>
    </article>
  </div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(location.search);
  var src = params.get("src") || "바자회_기획안.md";

  renderSidebar(src);
  renderWhere(src);
  loadDoc(src);

  // 사이드바를 펼치지 않아도 지금 읽는 자리를 알 수 있게 상단 바에 적어둔다.
  function renderWhere(currentSrc) {
    var where = "";
    NAV.forEach(function (group) {
      group.items.forEach(function (item) {
        if (item.path === currentSrc) where = group.group + " · " + item.label;
      });
    });
    document.getElementById("where").textContent = where;
  }

  function renderSidebar(currentSrc) {
    var nav = document.getElementById("sidebar");
    var currentLabel = "문서 목록";
    NAV.forEach(function (group) {
      group.items.forEach(function (item) {
        if (item.path === currentSrc) currentLabel = item.label;
      });
    });

    var html = '<button type="button" class="sidebar-toggle" id="sidebar-toggle">' +
      MD.escapeHtml(currentLabel) + ' <span class="chevron">&#9662;</span></button>';
    html += '<div class="sidebar-groups" id="sidebar-groups">';
    NAV.forEach(function (group) {
      html += "<h2>" + MD.escapeHtml(group.group) + "</h2><ul>";
      group.items.forEach(function (item) {
        var isActive = item.path === currentSrc;
        html += '<li><a href="doc.html?src=' + encodeURIComponent(item.path) + '"' +
          (isActive ? ' class="active"' : "") + ">" + MD.escapeHtml(item.label) + "</a></li>";
      });
      html += "</ul>";
    });
    html += "</div>";
    nav.innerHTML = html;

    document.getElementById("sidebar-toggle").addEventListener("click", function () {
      document.getElementById("sidebar-groups").classList.toggle("open");
      this.classList.toggle("open");
    });
  }

  function loadDoc(path) {
    var content = document.getElementById("content");
    fetch(path)
      .then(function (res) {
        if (!res.ok) throw new Error("문서를 찾을 수 없습니다 (" + res.status + ")");
        return res.text();
      })
      .then(function (text) {
        var baseDir = path.indexOf("/") >= 0 ? path.slice(0, path.lastIndexOf("/")) : "";
        var html = MD.render(text, baseDir);
        content.innerHTML = html;
        var h1 = content.querySelector("h1");
        document.title = (h1 ? h1.textContent : path) + " · 바자회 준비 허브";
        renderPrevNext(path);
      })
      .catch(function (err) {
        content.innerHTML = '<p class="doc-error">문서를 불러오지 못했습니다: ' + MD.escapeHtml(err.message) + "</p>" +
          '<p class="hint">경로: ' + MD.escapeHtml(path) + "</p>";
      });
  }

  // Footer links that walk the reading order, so a first-time reader can go
  // through every document in sequence without returning to the hub each time.
  function renderPrevNext(currentSrc) {
    var index = -1;
    SEQUENCE.forEach(function (item, i) { if (item.path === currentSrc) index = i; });
    if (index < 0) return;

    var prev = index > 0 ? SEQUENCE[index - 1] : null;
    var next = index < SEQUENCE.length - 1 ? SEQUENCE[index + 1] : null;

    var nav = document.createElement("nav");
    nav.className = "prev-next";
    nav.innerHTML =
      (prev
        ? '<a class="prev" href="doc.html?src=' + encodeURIComponent(prev.path) + '">' +
          '<span class="label">이전</span>' + MD.escapeHtml(prev.label) + "</a>"
        : "<span></span>") +
      '<span class="progress">' + (index + 1) + " / " + SEQUENCE.length + "</span>" +
      (next
        ? '<a class="next" href="doc.html?src=' + encodeURIComponent(next.path) + '">' +
          '<span class="label">다음</span>' + MD.escapeHtml(next.label) + "</a>"
        : "<span></span>");

    document.querySelector(".article-wrap").appendChild(nav);
  }

})();
</script>
</body>
</html>
